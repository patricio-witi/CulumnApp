<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Columna 3D</title>
<meta name="description" content="Atlas 3D interactivo de la columna: vértebras, discos, ligamentos, nervios y músculos, con simulación de movimientos y discopatía.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap">
<style>
/* Mesa de lectura radiológica: visor 3D a pantalla completa, paneles de vidrio a los lados,
   tipografía de revista médica para títulos y nombres latinos, monoespaciada para medidas. */
:root {
  --bg: #e9eef0;
  --bg-deep: #d5dde0;
  --panel: rgba(250, 252, 252, 0.9);
  --panel-solid: #f7f9f9;
  --raised: #ffffff;
  --line: #c9d4d7;
  --fg: #142024;
  --fg-2: #3e4d52;
  --muted: #64767b;
  --accent: #1d6f73;
  --accent-ink: #ffffff;
  --accent-soft: rgba(29, 111, 115, 0.12);
  --bone: #c8b48f;
  --muscle: #a53a31;
  --nerve: #b8901f;
  --lig: #8f8a7d;
  --disc: #5c8fb3;
  --pos: #e34948;
  --neg: #2a78d6;
  --mid: #d9dcd8;
  --good: #0ca30c;
  --warning: #c98500;
  --serious: #d06a3f;
  --critical: #d03b3b;
  --shadow: 0 10px 30px rgba(20, 32, 36, 0.12);
  --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1214; --bg-deep: #060a0b; --panel: rgba(16, 24, 27, 0.86); --panel-solid: #121a1d;
    --raised: #172226; --line: #26363b; --fg: #e4ebea; --fg-2: #b9c6c6; --muted: #83979a;
    --accent: #6cc0bb; --accent-ink: #062022; --accent-soft: rgba(108, 192, 187, 0.14);
    --bone: #e3d3b1; --muscle: #d0574b; --nerve: #e7c45a; --lig: #d6d0c2; --disc: #8cbfe0;
    --pos: #e66767; --neg: #3987e5; --mid: #383835;
    --warning: #fab219; --serious: #ec835a; --critical: #e06060; --good: #3fbf55;
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1214; --bg-deep: #060a0b; --panel: rgba(16, 24, 27, 0.86); --panel-solid: #121a1d;
  --raised: #172226; --line: #26363b; --fg: #e4ebea; --fg-2: #b9c6c6; --muted: #83979a;
  --accent: #6cc0bb; --accent-ink: #062022; --accent-soft: rgba(108, 192, 187, 0.14);
  --bone: #e3d3b1; --muscle: #d0574b; --nerve: #e7c45a; --lig: #d6d0c2; --disc: #8cbfe0;
  --pos: #e66767; --neg: #3987e5; --mid: #383835;
  --warning: #fab219; --serious: #ec835a; --critical: #e06060; --good: #3fbf55;
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 35%, var(--bg) 0%, var(--bg-deep) 100%);
  background-color: var(--bg);
  color: var(--fg); font: 14px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; }
.latin { font-family: var(--font-display); font-style: italic; color: var(--muted); }
.mono, .num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

#app { position: fixed; inset: 0; display: grid; grid-template-columns: 268px 1fr 404px; grid-template-rows: 56px 1fr; padding-top: env(safe-area-inset-top, 0px); }
#viewport { grid-column: 1 / -1; grid-row: 1 / -1; position: relative; touch-action: none; }
#viewport canvas { display: block; width: 100%; height: 100%; outline: none; }

/* barra superior */
.topbar { grid-column: 1 / -1; grid-row: 1; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 0 16px; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 22px; letter-spacing: -0.01em; }
.brand .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { margin-left: auto; display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; color: var(--fg-2); font-weight: 500; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tabs .s { display: none; }
.icon-btn { border: 1px solid var(--line); background: var(--panel); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.icon-btn svg { width: 18px; height: 18px; }

/* paneles */
.panel { z-index: 4; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
#layers { grid-column: 1; grid-row: 2; margin: 8px 0 16px 16px; align-self: start; max-height: calc(100% - 24px); }
#side { grid-column: 3; grid-row: 2; margin: 8px 16px 16px 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
.panel-body { overflow-y: auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 14px; min-height: 0; overscroll-behavior: contain; }
.panel-body::-webkit-scrollbar { width: 8px; }
.panel-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

/* capas */
.layer-row { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 8px; padding: 3px 0; }
.swatch { width: 12px; height: 12px; border-radius: 3px; }
.layer-row label { cursor: pointer; display: flex; align-items: center; gap: 8px; }
.layer-row input[type="range"] { width: 72px; }
.sub-rows { padding-left: 22px; display: none; flex-direction: column; gap: 2px; }
.sub-rows.open { display: flex; }
.disclosure { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 2px; font-size: 12px; }
input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
input[type="range"] { accent-color: var(--accent); }

/* controles */
.group { display: flex; flex-direction: column; gap: 8px; }
.group h3 { font-size: 16px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button, .chip { border: 1px solid var(--line); background: var(--raised); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-size: 13px; color: var(--fg-2); }
.seg button[aria-pressed="true"], .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
.chip:hover, .seg button:hover { border-color: var(--accent); }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.slider label { font-size: 13px; color: var(--fg-2); }
.slider output { font-family: var(--font-data); font-size: 12px; color: var(--fg); min-width: 7ch; text-align: right; }
.slider input { grid-column: 1 / -1; width: 100%; }
.slider .ends { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: -2px; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 500; }
.btn.ghost { background: transparent; color: var(--accent); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
select { border: 1px solid var(--line); background: var(--raised); border-radius: 8px; padding: 5px 8px; max-width: 100%; }

/* tarjetas y texto */
.card { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.prose { font-size: 14px; color: var(--fg-2); max-width: 65ch; }
.prose p { margin: 0 0 8px; }
.prose strong { color: var(--fg); }
.prose ul { margin: 0 0 8px; padding-left: 18px; }
.prose li { margin: 2px 0; }
.cite { font-size: 12px; color: var(--muted); }
.callout { border-left: 3px solid var(--critical); padding: 8px 10px; background: color-mix(in srgb, var(--critical) 8%, transparent); border-radius: 0 8px 8px 0; font-size: 13px; }
.callout.info { border-left-color: var(--accent); background: var(--accent-soft); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--fg-2); }
.kv dd { margin: 0; text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.status i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.struct-list { display: flex; flex-direction: column; gap: 2px; max-height: 260px; overflow-y: auto; }
.struct-list button { text-align: left; border: 0; background: transparent; padding: 4px 6px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: center; color: var(--fg-2); }
.struct-list button:hover { background: var(--accent-soft); color: var(--fg); }
.struct-list .grp { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 6px 2px; font-weight: 600; }
input[type="search"] { border: 1px solid var(--line); background: var(--raised); border-radius: 8px; padding: 7px 10px; width: 100%; box-sizing: border-box; }

/* gráficos */
.viz { width: 100%; }
.viz text { font-family: var(--font-data); font-size: 10px; fill: var(--muted); }
.viz .lvl { fill: var(--fg-2); }
.viz .title { font-family: var(--font-ui); font-size: 11px; fill: var(--fg-2); font-weight: 600; }
.viz .axis { stroke: var(--line); stroke-width: 1; }
.viz .zero { stroke: var(--muted); stroke-width: 1; }
.tooltip { position: fixed; z-index: 20; pointer-events: none; background: var(--panel-solid); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: var(--shadow); max-width: 280px; }
.tooltip .latin { display: block; font-size: 12px; }

/* overlays del visor */
#hover-label { position: absolute; pointer-events: none; z-index: 6; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 12px; box-shadow: var(--shadow); white-space: nowrap; transform: translate(12px, 12px); }
#views { position: absolute; z-index: 5; left: var(--free-center, 50%); bottom: 18px; transform: translateX(-50%); display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); max-width: min(calc(100vw - 32px), calc(100vw - 720px)); overflow-x: auto; }
#views button { border: 0; background: transparent; color: var(--fg-2); border-radius: 999px; padding: 6px 11px; cursor: pointer; font-size: 12.5px; white-space: nowrap; }
#views button:hover { background: var(--accent-soft); color: var(--fg); }
#legend { position: absolute; z-index: 5; left: 300px; bottom: 74px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
#legend .bar { width: 160px; height: 8px; border-radius: 4px; }
#legend .ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 30; background: radial-gradient(120% 90% at 50% 35%, var(--bg) 0%, var(--bg-deep) 100%); transition: opacity .6s; }
#loading .box { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 0 16px; }
#loading .meter { width: 220px; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
#loading .meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.hint { font-size: 12px; color: var(--muted); }

/* barras de indicadores */
.mbar { display: grid; grid-template-columns: minmax(0, 1fr) 90px auto; align-items: center; gap: 8px; font-size: 12.5px; color: var(--fg-2); padding: 2px 0; }
.mbar .track { height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; }
.mbar .track i { display: block; height: 100%; border-radius: 4px; transition: width .25s; }
.mbar output { font-family: var(--font-data); font-size: 12px; color: var(--fg); min-width: 9ch; text-align: right; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.ep-legend dd { font-family: var(--font-ui); color: var(--muted); }
/* ejercicios */
.ex-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ex-list button { text-align: left; border: 1px solid var(--line); background: var(--raised); border-radius: 8px; padding: 7px 9px; cursor: pointer; display: flex; flex-direction: column; gap: 1px; color: var(--fg); }
.ex-list button small { color: var(--muted); font-size: 11px; }
.ex-list button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.musc { display: flex; flex-direction: column; gap: 3px; }
.musc .mbar { grid-template-columns: minmax(0, 1fr) 70px 8ch; }
.tag { display: inline-block; font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; color: var(--fg-2); margin: 0 4px 4px 0; }
.tag.warn { border-color: var(--warning); color: var(--fg); }

/* lección */
.lesson-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; }
.dots button { width: 9px; height: 9px; border-radius: 50%; border: 0; background: var(--line); padding: 0; cursor: pointer; }
.dots button[aria-current="true"] { background: var(--accent); }
.lesson-title { font-size: 22px; line-height: 1.2; }

/* modal */
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel-solid); color: var(--fg); max-width: 720px; width: calc(100vw - 32px); padding: 0; box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
dialog .panel-body { max-height: 70vh; }

#mobile-toggle { display: none; }

@media (max-width: 1100px) {
  #app { grid-template-columns: 240px 1fr 360px; }
  #views { max-width: calc(100vw - 640px); }
  #legend { left: 270px; }
}
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 52px 1fr auto; }
  .topbar { padding: 0 12px; gap: 8px; }
  .brand .sub { display: none; }
  .brand h1 { font-size: 19px; }
  .tabs { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); justify-content: space-between; z-index: 8; }
  .tabs button { padding: 7px 4px; font-size: 12px; flex: 1; }
  .tabs .l { display: none; }
  .tabs .s { display: inline; }
  .ex-list { grid-template-columns: 1fr; }
  #layers { position: fixed; top: calc(56px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; margin: 0; max-height: 55vh; display: none; }
  #layers.open { display: flex; }
  #side { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 58px); margin: 0; max-height: 46vh; }
  #side.collapsed .panel-body { display: none; }
  #views { bottom: auto; top: calc(56px + env(safe-area-inset-top, 0px)); left: 50%; max-width: calc(100vw - 24px); }
  #legend { left: 12px; bottom: auto; top: calc(104px + env(safe-area-inset-top, 0px)); padding: 6px 8px; }
  #legend .hint { display: none; }
  #mobile-toggle { display: grid; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <div id="viewport" aria-label="Modelo 3D de la columna vertebral"></div>
  <header class="topbar">
    <div class="brand"><h1>Columna 3D</h1><span class="sub">Atlas interactivo · huesos, discos, ligamentos, nervios y músculos</span></div>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button role="tab" id="tab-explore" aria-selected="true" data-tab="explore">Explorar</button>
      <button role="tab" id="tab-move" aria-selected="false" data-tab="move"><span class="l">Movimiento</span><span class="s">Mover</span></button>
      <button role="tab" id="tab-case" aria-selected="false" data-tab="case"><span class="l">Mi columna</span><span class="s">Mi caso</span></button>
      <button role="tab" id="tab-episode" aria-selected="false" data-tab="episode">Episodio</button>
      <button role="tab" id="tab-exercise" aria-selected="false" data-tab="exercise"><span class="l">Ejercicios</span><span class="s">Ejercic.</span></button>
      <button role="tab" id="tab-class" aria-selected="false" data-tab="class">Clase</button>
    </nav>
    <button class="icon-btn" id="mobile-toggle" aria-label="Capas" title="Capas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg></button>
    <button class="icon-btn" id="theme-btn" aria-label="Cambiar tema" title="Cambiar tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button>
    <button class="icon-btn" id="about-btn" aria-label="Método y fuentes" title="Método y fuentes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
  </header>
  <aside id="layers" class="panel" aria-label="Capas anatómicas">
    <div class="panel-head"><span class="eyebrow">Capas</span><button class="chip" id="reset-layers">Restablecer</button></div>
    <div class="panel-body" id="layers-body"></div>
  </aside>
  <section id="side" class="panel" aria-live="polite">
    <div class="panel-head" id="side-head"><span class="eyebrow" id="side-title">Explorar</span><button class="chip" id="side-collapse" hidden>Ocultar</button></div>
    <div class="panel-body" id="side-body"></div>
  </section>
</div>
<div id="hover-label" hidden></div>
<div class="tooltip" id="tooltip" hidden></div>
<div id="views" role="toolbar" aria-label="Vistas de cámara"></div>
<div id="legend" hidden></div>
<div id="loading"><div class="box"><h2 style="font-size:28px">Columna 3D</h2><div class="hint" id="loading-msg">Cargando huesos…</div><div class="meter"><i id="loading-bar"></i></div></div></div>
<dialog id="about"><div class="panel-head"><h2 style="font-size:20px">Método, límites y fuentes</h2><button class="chip" id="about-close">Cerrar</button></div><div class="panel-body prose" id="about-body"></div></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
